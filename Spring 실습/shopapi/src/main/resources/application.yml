spring:
  application:
    name: skala-shop-api
  
  datasource:
    url: jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

jwt:
  # 운영 환경에서는 반드시 JWT_SECRET 환경 변수로 충분히 긴 무작위 값을 주입하세요.
  secret: ${JWT_SECRET:shopapi-local-development-secret-key-change-me}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
