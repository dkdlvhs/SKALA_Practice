<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제목 관련 태그</title>
    <style>
        div h2 {
            text-align: center;
        }

        div::before {
            content : "*";
        }

        div::after {
            content : "*";
        }
    </style>
</head>
<body>
    <div>
        <h1>
            HTML 기초 실습
            <p>제목 관련 태그</p>
        </h1>
        <h2>
            자주 사용하는 <mark>HTML</mark> 태그
        </h2>
    </div>
    <p>HTML은 웹 페이지의 구조를 만드는 언어입니다.
    <br>다양한 태그를 사용하여 문서를 구성할 수 있습니다.</p>
</body>
</html>
