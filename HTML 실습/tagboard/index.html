<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏷️ 키워드 태그 보드</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="board-container">
        <h2>🏷️ 오늘 배운 핵심 키워드</h2>
        <p class="desc">키워드를 입력하고 엔터(Enter) 키를 눌러 태그를 등록해 보세요!</p>
        
        <div class="input-area">
            <input type="text" id="tag-input" placeholder="키워드 입력 후 Enter..." autocomplete="off">
        </div>
        
        <!-- 동적으로 태그 상자들이 나열될 컨테이너 -->
        <div id="tag-container" class="tag-container">
            <!-- 자바스크립트를 통해 동적으로 삽입될 태그들 -->
        </div>
    </div>
    <!-- 모듈 형식이 아닌 일반 순수 자바스크립트 파일 로드 -->
    <script src="app.js"></script>
</body>
</html>
