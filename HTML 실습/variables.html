<!DOCTYPE html>
<html>
<head>
<style>
:root {
  --primary: #04AA6D;
  --text: white;
}

.header {
  padding: 15px;
  /* use var(--primary) */
  background-color: var(--primary);
}

.btn {
  padding: 10px 20px;
  border: none;
  cursor: pointer;
  /* use var(--primary) and var(--text) */
  background-color: var(--primary);
  color: var(--text);
}

.btn:hover {
  color: red;
}
</style>
</head>
<body>

<div class="header">My Website</div>
<p><button class="btn">Click Me</button></p>

</body>
</html>
